server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers. Add a Content-Security-Policy tuned to your
    # product before going live.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA fallback: every non-file route goes to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # RESET the header — never append. The rate limiter keys on the first
        # hop, and appending would let clients choose their own key.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
