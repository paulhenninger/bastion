# The web server: serves the SPA and proxies /api to the backend, so the browser
# sees a single origin (which the refresh cookie and the CSP rely on). It runs as
# an unprivileged user on a read-only filesystem: everything it writes is in /tmp.
#
# It owns the browser security headers for the pages (security-headers.conf);
# the API sets its own, stricter ones.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The access log records the path only: no query string, no Referer. Bastion's
    # emailed links keep their tokens in the URL fragment, which never reaches a
    # server, but whatever you add later may not — so nothing in a query string is
    # ever written to the log here.
    map $request_uri $request_path {
        "~^(?<path>[^?]*)" $path;
    }
    log_format private '$remote_addr [$time_local] "$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent $request_time $request_id "$http_user_agent"';
    access_log /dev/stdout private;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The client address the rate limits key on. X-Forwarded-For is believed only
    # from a proxy listed in trusted-proxies.conf (none by default); from anyone
    # else, the connecting address is the client. See that file.
    include /etc/nginx/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # https as reported by the TLS terminator in front, else this connection's scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Coarse first-line throttle on the auth API (the app enforces finer
    # per-endpoint, per-account limits behind this), keyed on the real client.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Bodies the API accepts are tiny; the app also enforces its own 64 KiB cap.
        client_max_body_size 64k;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # Security headers are included per location: add_header does NOT merge,
        # so a location with an add_header of its own silently drops inherited ones.
        # The /api locations include none: the API sets its own.

        # SPA fallback: every non-file route gets index.html, never cached, so a
        # deploy (and any CSP change) reaches users immediately.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Hashed assets are immutable.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            limit_req_status 429;
            include /etc/nginx/snippets/api-proxy.conf;
        }

        location /api/ {
            include /etc/nginx/snippets/api-proxy.conf;
        }

        # The actuator is on the app's separate management port and is never
        # proxied. Belt and braces: refuse the path outright.
        location /actuator {
            include /etc/nginx/snippets/security-headers.conf;
            return 404;
        }

        # For the container healthcheck only.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
