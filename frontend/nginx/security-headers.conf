# Browser security headers for the SPA. See nginx.conf for why this is a snippet.
#
# Content-Security-Policy, directive by directive:
#   default-src 'self'          nothing loads from elsewhere unless listed below
#   script-src  'self' + Cloudflare Turnstile (only fetched when a site key is configured).
#                No 'unsafe-inline', no 'unsafe-eval': an injected <script> or
#                onclick= attribute does not run, which makes CSP a real XSS backstop.
#   style-src   'self'          (React's style={} uses the CSSOM, which CSP allows)
#   img-src     'self' data:    the TOTP QR code is a data: URL rendered in the browser —
#                               the secret is never sent to a third-party QR service
#   connect-src 'self'          the API is same-origin
#   frame-src   Turnstile only; frame-ancestors 'none' — nobody may frame us (clickjacking)
#   form-action 'self', base-uri 'none', object-src 'none'
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Passkeys need publickey-credentials-get/create on our own origin; everything else is off.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HTTPS only, for a year. Browsers ignore it over plain http (local development),
# so it is safe to send everywhere; the TLS terminator in front may set it too.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
