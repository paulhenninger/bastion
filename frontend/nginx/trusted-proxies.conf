# Which proxies may tell nginx the client's address (X-Forwarded-For).
#
# Default: none. The connecting address is the client, and any X-Forwarded-For a
# client sends is ignored. That is safe when this container faces the internet
# directly; behind a load balancer, though, every visitor then shares the
# balancer's address and so its rate-limit budget.
#
# Behind a TLS terminator or load balancer, mount your own copy of this file at
# /etc/nginx/trusted-proxies.conf listing ONLY that proxy's address(es). Anyone
# listed here can claim to be any client and dodge the per-IP limits, so never
# list a range wider than your proxy, nor a network clients can reach:
#
#   set_real_ip_from 10.0.3.17;
#
# Either way, nginx then RESETS X-Forwarded-For to the address it settled on
# before proxying (api-proxy.conf), which the app's TRUST_FORWARDED_FOR relies on.
