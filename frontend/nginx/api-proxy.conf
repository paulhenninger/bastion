proxy_pass http://app:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;
# RESET the header — never append ($proxy_add_x_forwarded_for). The app's rate
# limiters key on the first hop, and appending would let clients choose their own key.
# $remote_addr is the client as settled by trusted-proxies.conf.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
