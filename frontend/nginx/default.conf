# Serves the SPA and proxies /api to the backend. This container owns the browser
# security headers. If you terminate TLS in front of it (you should), add HSTS
# there — only the TLS terminator knows the site is served over HTTPS:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server_tokens off;

# Coarse first-line throttle on the auth API (the app enforces finer per-endpoint,
# per-account limits behind this). Keyed on the real client address.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bodies the API accepts are tiny; the app also enforces its own 64 KiB cap.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Browser security headers live in a snippet, included per location: add_header
    # does NOT merge, so a location with an add_header of its own silently drops every
    # inherited one. The /api locations deliberately include none: the API sets its
    # own, stricter, headers (CSP default-src 'none', etc.).

    # SPA fallback: every non-file route goes to index.html. Never cached, so a
    # deploy (and any CSP change) reaches users immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # The actuator is served on the app's separate management port and is never
    # proxied. Belt and braces: refuse the path outright.
    location /actuator {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
}
