# Dev stack: MySQL + Mailpit always; add the app + web images with
#   docker compose --profile full up -d --build
# For day-to-day development run only the databases here and use
# `./gradlew bootRun` + `npm run dev` for hot reload.
#
# This file is for development. For production see docs/operations.md.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-bastion}
      MYSQL_DATABASE: ${DB_NAME:-bastion}
      MYSQL_USER: ${DB_USER:-bastion}
      MYSQL_PASSWORD: ${DB_PASS:-bastion}
    ports:
      - "127.0.0.1:3306:3306"   # loopback only: never expose a dev database
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local mail catcher — every email the app sends lands in the web UI at
  # http://localhost:8025. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  app:
    profiles: ["full"]
    build: .
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-bastion}
      DB_USER: ${DB_USER:-bastion}
      DB_PASS: ${DB_PASS:-bastion}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 32)}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env (openssl rand -base64 32)}"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      MAIL_FROM: ${MAIL_FROM:-Bastion <no-reply@bastion.local>}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # nginx (the web service) resets X-Forwarded-For, so the app may trust it.
      TRUST_FORWARDED_FOR: "true"
      # Mailpit's fake domains have no MX records.
      SIGNUP_CHECK_MX: ${SIGNUP_CHECK_MX:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "127.0.0.1:9091:9091"   # management (health, Prometheus) — loopback only
    depends_on:
      mysql:
        condition: service_healthy

  web:
    profiles: ["full"]
    build: ./frontend
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - app

volumes:
  mysql-data:
