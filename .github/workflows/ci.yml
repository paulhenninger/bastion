name: CI

# Note the push filter is scoped to the default branches. That matters: an
# unscoped `push:` next to `pull_request:` fires BOTH events on a branch with an
# open PR and runs the whole suite twice on the identical commit. Actions also
# bills per job rounded UP to the whole minute, so keep jobs few rather than
# small — this repo is public (minutes are free), but anyone using the starter
# in a private repo pays for both mistakes.
on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded PR runs; never cancel a default-branch run halfway.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # `build` runs every test — including MySqlMigrationTest, which needs the
      # Docker that ubuntu-latest provides — and SpotBugs + find-sec-bugs.
      - name: Build, test and analyse
        run: ./gradlew build --console=plain
      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs
          path: build/reports/spotbugs/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      # Only what ships to browsers; dev tooling advisories don't reach users.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check and build
        run: npm run build

  # Blocks a PR that adds a dependency with a known vulnerability.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
