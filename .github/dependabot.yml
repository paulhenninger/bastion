version: 2

# Security updates only (except Docker images, at the end): open-pull-requests-limit 0 turns off the weekly
# version-update PRs (and the CI minutes each one costs); Dependabot still
# raises a PR for a vulnerable dependency, using the groups and ignores below.
updates:
  # Backend — Spring Boot, Spring Security, JJWT, Flyway, MySQL driver. GitHub
  # cannot read a Gradle build by itself: these alerts and security PRs exist
  # only because dependency-submission.yml submits the resolved graph.
  - package-ecosystem: gradle
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  # Frontend SPA — React, React Router, Vite, TypeScript
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # CI workflow actions (checkout, setup-java, setup-node, setup-gradle)
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # Base images are pinned to a digest, and Docker images get no security
  # advisories, so version updates are ON for them (unlike everything above):
  # it's the only way the pins move. One grouped PR per directory, which the
  # Security workflow scans and smoke-tests. Majors are moved by hand: Java and
  # Node stay on LTS lines (Java 25 → 29; Node 26 → 28), and nginx on its stable
  # branch (even minor; the next minor is always mainline).
  - package-ecosystem: docker
    open-pull-requests-limit: 2
    directories: ["/", "/frontend"]
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginxinc/nginx-unprivileged"
        update-types: ["version-update:semver-minor"]

  # Compose images (MySQL, Mailpit). MySQL stays on its LTS line (9.7): later
  # versions are dated Innovation releases (26.x) supported only until the
  # next. Move to the next LTS by hand.
  - package-ecosystem: docker-compose
    open-pull-requests-limit: 2
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "mysql"
        versions: [">= 10"]
