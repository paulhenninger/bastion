version: 2

# Security updates only: open-pull-requests-limit 0 turns off the weekly
# version-update PRs (and the CI minutes each one costs); Dependabot still
# raises a PR for a vulnerable dependency, using the groups and ignores below.
updates:
  # Backend — Spring Boot, Spring Security, JJWT, Flyway, MySQL driver
  - package-ecosystem: gradle
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  # Frontend SPA — React, React Router, Vite, TypeScript
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # CI workflow actions (checkout, setup-java, setup-node, setup-gradle)
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # Base images: eclipse-temurin (backend build + runtime). Majors are moved by
  # hand: Java stays on an LTS line (25 now, 29 next), never 26-28.
  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base images: node (SPA build) + nginx (SPA runtime). Node stays on an LTS
  # (even) major, moved by hand.
  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Compose images: MySQL stays on its LTS line (9.7). Versions after 9.7 are
  # dated Innovation releases (26.x) supported only until the next one; move to
  # the next LTS by hand.
  - package-ecosystem: docker-compose
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "mysql"
        versions: [">= 10"]
